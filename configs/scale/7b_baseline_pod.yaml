# LOLM 7B Baseline — TPU v4-32 Pod (32 chips)
# Decoder-only (no SSM, no regime, no memory, no gate)
# Matched parameter count to 7B LOLM via extra decoder layers
#
# LOLM 7B: d=4096, 32 layers, d_ff=11008, + SSM/regime/gate ≈ 7B
# Baseline: d=4096, 36 layers, d_ff=11008, decoder-only ≈ 7B
#
# Effective batch: 4 × 2 accum × 32 chips = 256

model:
  d_model: 4096
  n_heads: 32
  n_layers: 36              # Extra layers to match ~7B params
  d_ff: 11008
  vocab_size: 50257
  max_seq_len: 1024
  dropout: 0.05

  ssm:
    enabled: false
  regime:
    enabled: false
  memory:
    enabled: false
  gate:
    enabled: false

training:
  device: xla
  batch_size: 1   # 16GB HBM per chip: 36 decoder layers, no SSM; batch=1 single accum
  grad_accumulation_steps: 1  # global batch = 1×1×16 = 16
  seq_len: 1024
  max_steps: 50000
  lr: 1.5e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 2000
  grad_clip: 0.5
  dtype: bfloat16
  log_interval: 10
  eval_interval: 2000
  save_interval: 500
  cache_clear_interval: 5000
  compile: false
  gradient_checkpointing: true

loss:
  lambda_future: 0.0
  lambda_regime: 0.0
  lambda_mem: 0.0
  lambda_manifest: 0.0
  lambda_balance: 0.0
  use_load_balance: false
  lambda_sticky: 0.0
  use_cpc: false
  cpc_proj_dim: 0
  lambda_changepoint: 0.0
  lambda_competitive: 0.0
  future_window: 8

data:
  streaming: true
  dataset: HuggingFaceFW/fineweb-edu
  tokenizer: gpt2
