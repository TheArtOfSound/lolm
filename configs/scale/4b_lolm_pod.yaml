# LOLM 4B — large scale, grad checkpointing required

model:
  d_model: 3584
  n_heads: 28
  n_layers: 28
  d_ff: 8192
  vocab_size: 50257
  max_seq_len: 256
  dropout: 0.05
  ssm:
    enabled: true
    n_layers: 2
    d_state: 64
    expand: 2
    use_cuda_kernels: false
    detach_gradients: true
  regime:
    enabled: true
    n_codes: 64
    d_regime: 256
    temp_start: 1.0
    temp_end: 0.5
    temp_anneal_steps: 200000
    neighbor_interaction: true
    neighbor_kernel_size: 7
    gradient_isolation: true
  memory:
    enabled: true
    n_slots: 64
    n_banks: 3
    slot_dim: 3584
    n_chunks: 4
  gate:
    enabled: true
    init_bias: -0.5
    normalize_branches: true
training:
  device: xla
  batch_size: 1
  grad_accumulation_steps: 1
  seq_len: 256
  max_steps: 50000
  lr: 0.00015
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 2000
  grad_clip: 0.5
  dtype: bfloat16
  log_interval: 10
  eval_interval: 2000
  save_interval: 500
  compile: false
  gradient_checkpointing: false
loss:
  use_cpc: true
  cpc_proj_dim: 128
  cpc_temperature: 0.07
  lambda_future: 0.5
  lambda_competitive: 0.1
  lambda_manifest: 0.01
  lambda_changepoint: 0.1
  lambda_regime: 0.3
  lambda_balance: 0.1
  lambda_sticky: 0.01
  lambda_mem: 0.05
  future_window: 8
  use_load_balance: true
  cpc_max_positions: 256
data:
  streaming: true
  dataset: HuggingFaceFW/fineweb-edu
  tokenizer: gpt2
