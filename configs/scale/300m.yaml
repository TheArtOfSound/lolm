# LOLM 300M — Single A100 80GB
# ~300M parameters, serious prototype
# Training: ~2-3 days on 1x A100
# Cost: ~$50-80 on Vast.ai

model:
  d_model: 1024
  n_heads: 16
  n_layers: 16
  d_ff: 4096
  vocab_size: 50257
  max_seq_len: 2048
  dropout: 0.1

  ssm:
    enabled: true
    n_layers: 4
    d_state: 32
    expand: 2
    use_cuda_kernels: true

  regime:
    enabled: true
    n_codes: 32
    d_regime: 128
    temp_start: 1.0
    temp_end: 0.1
    temp_anneal_steps: 100000

  memory:
    enabled: true
    n_slots: 128
    n_banks: 3
    slot_dim: 1024

  gate:
    enabled: true

training:
  batch_size: 8
  seq_len: 2048
  max_steps: 200000
  lr: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 2000
  grad_clip: 1.0
  device: cuda
  dtype: bfloat16
  log_interval: 100
  eval_interval: 2000
  save_interval: 10000
  cache_clear_interval: 500
  compile: true          # torch.compile for CUDA
  grad_accumulation: 4   # effective batch = 8 * 4 = 32
  use_mamba_cuda: true   # use mamba-ssm CUDA kernels

loss:
  lambda_future: 0.1
  lambda_regime: 0.05
  lambda_mem: 0.05
  lambda_manifest: 0.01
  future_window: 16

data:
  dataset: roneneldan/TinyStories
  tokenizer: gpt2
  cache_dir: ./data
