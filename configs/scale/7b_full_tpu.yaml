_base_: 1b_v3.4.yaml

model:
  d_model: 4096
  n_heads: 32
  n_layers: 32
  d_ff: 16384
  ssm:
    enabled: true
    use_cuda_kernels: false
    d_state: 32
    n_layers: 8
  regime:
    enabled: true
    gradient_isolation: true
  memory:
    enabled: true
  gate:
    enabled: true

training:
  device: xla
  batch_size: 1
  grad_accumulation_steps: 1
  compile: false
  gradient_checkpointing: false
  cache_clear_interval: 10000
  seq_len: 512
  log_interval: 1
  dtype: bfloat16
  grad_clip: 1.0
  lr: 1.5e-4
  warmup_steps: 2000
  save_interval: 2000
  max_steps: 20000
