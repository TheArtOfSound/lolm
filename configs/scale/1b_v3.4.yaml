# LOLM 1.57B v3.4 — H200 140GB (Speed-Optimized + CPC Fix)
# ~1.57B parameters, all v3 features + v3.4 CPC scaling fix
#
# Speed optimizations over v3.3:
#   1. gradient_checkpointing: false — Flash Attn means ~55GB activations, fits in 140GB
#   2. torch.compile mode=max-autotune — CUDA graphs + aggressive kernel fusion
#   3. TF32 matmul precision — faster fp32 accumulations
#   4. cudnn.benchmark — auto-tune conv kernels (regime neighbor conv1d)
#   5. Less frequent saves/cache clears — reduce I/O overhead
#
# v3.4 fixes:
#   - CPC projection hidden layer scales with d_model (1024 not 512)
#   - Separate gradient clipping for model vs CPC params
#
# Target: >=1.5 steps/sec on H200 140GB

model:
  d_model: 2048
  n_heads: 16
  n_layers: 24
  d_ff: 8192
  vocab_size: 50257
  max_seq_len: 2048
  dropout: 0.05

  ssm:
    enabled: true
    n_layers: 6
    d_state: 64
    expand: 2
    use_cuda_kernels: true

  regime:
    enabled: true
    n_codes: 64
    d_regime: 256
    temp_start: 1.0
    temp_end: 0.5              # Keep stochasticity for phase exploration
    temp_anneal_steps: 200000  # Slow anneal — longer warmup for 1B
    neighbor_interaction: true
    neighbor_kernel_size: 7
    gradient_isolation: true   # v3.1: detach regime from token loss (prevents collapse)

  memory:
    enabled: true
    n_slots: 256
    n_banks: 3
    slot_dim: 2048
    n_chunks: 4  # v3: split into 4 chunks, chain write->read

  gate:
    enabled: true
    init_bias: -0.5
    normalize_branches: true

training:
  batch_size: 32             # Max single-pass batch for H200
  seq_len: 2048
  max_steps: 200000          # Realistic target at 1.5 steps/s = ~37 hours
  lr: 1.5e-4                 # Standard scaling law for 1.57B
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 4000
  grad_clip: 0.5             # Tighter clipping for stability at scale
  device: cuda
  dtype: bfloat16
  log_interval: 50
  eval_interval: 5000
  save_interval: 10000       # v3.4: less frequent saves (was 5000), saves ~6GB write each
  cache_clear_interval: 5000 # v3.4: less frequent cache clears (was 2000)
  grad_accumulation_steps: 1 # No accum needed (batch=32 fits)
  compile: true
  gradient_checkpointing: false  # v3.4: Flash Attn means activations fit in 140GB HBM

loss:
  lambda_future: 0.5           # L_L: CPC contrastive (proven at 300M)
  lambda_regime: 0.3           # L_r: regime diversity (proven)
  lambda_mem: 0.05             # L_m: memory focus
  lambda_manifest: 0.01        # Legacy gate regularizer
  future_window: 8             # v3.1: shorter window to bootstrap CPC
  lambda_balance: 0.5          # Load-balancing inside L_r
  use_load_balance: true
  lambda_sticky: 0.2           # Sticky transitions inside L_r
  # v3 formal losses
  use_cpc: true                # L_L: InfoNCE (proven to learn at 300M)
  cpc_temperature: 0.07        # v3.2: calibrated for d_proj=128
  cpc_max_positions: 256
  cpc_proj_dim: 128            # v3.2: SimCLR/CLIP projection
  lambda_changepoint: 0.1      # L_E: regime tracks representation shifts
  lambda_competitive: 0.1      # L_g: gate tracks branch utility

data:
  dataset: HuggingFaceFW/fineweb-edu
  tokenizer: gpt2
  cache_dir: ./data
  streaming: true
