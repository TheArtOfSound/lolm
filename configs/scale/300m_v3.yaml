# LOLM 300M v3.1 — H200 140GB (Full Formal Latent-Order Training)
# ~300M parameters with complete v3 loss formulation:
#
# v3.1 fixes (regime STILL collapsed 32→1 by step 450 in v3.0):
#   1. Regime gradient isolation: detach r_embed from token loss path
#      (VQ-VAE style — regime trained only by its own losses)
#   2. Logit clamping [-5,5]: prevent extreme logits overriding Gumbel noise
#   3. Stronger CPC signal: λ_future 0.1→0.5, future_window 16→8
#   4. Full loss component logging for diagnostics
#
# Engineering fixes (from v3.0):
#   1. Chunked memory (4 chunks): write path now gets gradients
#   2. Stronger load-balancing (λ=0.5) + sticky transitions (λ=0.2)
#   3. Higher temp floor (0.5) + longer anneal (150K steps)
#
# Formal v3 losses (from ChatGPT consultation):
#   L = L_tok + λ_L·L_L + λ_E·L_E + λ_r·L_r + λ_g·L_g + λ_m·L_m
#   L_L: CPC contrastive — z_t must encode future structure (InfoNCE)
#   L_E: Changepoint alignment — regimes track representation shifts
#   L_r: Regime diversity — load-balance + entropy + sticky transitions
#   L_g: Competitive gate — gate tracks which branch predicts better
#   L_m: Memory focus — encourage selective memory reads
#
# Training: batch_size=32, accum=2, effective=64 (proven on H200)
# Estimated: ~200K steps, 0.7 steps/s → ~79 hours

model:
  d_model: 1024
  n_heads: 16
  n_layers: 16
  d_ff: 4096
  vocab_size: 50257
  max_seq_len: 2048
  dropout: 0.1

  ssm:
    enabled: true
    n_layers: 4
    d_state: 32
    expand: 2
    use_cuda_kernels: true

  regime:
    enabled: true
    n_codes: 32
    d_regime: 128
    temp_start: 1.0
    temp_end: 0.5              # MPST: keep stochasticity
    temp_anneal_steps: 150000  # Slower anneal — give diversity time to establish
    neighbor_interaction: true
    neighbor_kernel_size: 7
    gradient_isolation: true   # v3.1: detach regime from token loss (prevents collapse)

  memory:
    enabled: true
    n_slots: 128
    n_banks: 3
    slot_dim: 1024
    n_chunks: 4  # v3: split 2048 tokens into 4x512 chunks, chain write→read

  gate:
    enabled: true
    init_bias: -0.5
    normalize_branches: true

training:
  batch_size: 32             # Proven: 106 GB / 143.8 GB on H200
  seq_len: 2048
  max_steps: 200000
  lr: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 2000
  grad_clip: 1.0
  device: cuda
  dtype: bfloat16
  log_interval: 50
  eval_interval: 2000
  save_interval: 5000
  cache_clear_interval: 500
  grad_accumulation_steps: 2  # effective batch = 32 * 2 = 64
  compile: false              # Safe: avoid torch.compile issues with chunked loop

loss:
  lambda_future: 0.5           # L_L: CPC contrastive weight (v3.1: 0.1→0.5 — was at random chance)
  lambda_regime: 0.3           # L_r: regime diversity weight
  lambda_mem: 0.05             # L_m: memory focus weight
  lambda_manifest: 0.01        # Legacy gate regularizer
  future_window: 8             # v3.1: 16→8 — easier prediction task to bootstrap CPC learning
  lambda_balance: 0.5          # Load-balancing inside L_r
  use_load_balance: true
  lambda_sticky: 0.2           # Sticky transitions inside L_r
  # v3 formal losses
  use_cpc: true                # L_L: InfoNCE instead of cosine similarity
  cpc_temperature: 0.1         # InfoNCE temperature (lower = sharper)
  cpc_max_positions: 256       # Subsample positions for memory efficiency
  lambda_changepoint: 0.1      # L_E: regime transitions track representation shifts
  lambda_competitive: 0.1      # L_g: gate tracks which branch predicts better

data:
  dataset: HuggingFaceFW/fineweb-edu
  tokenizer: gpt2
  cache_dir: ./data
  streaming: true
