# LOLM 300M BASELINE — TPU v4-8 CORRECTED CONFIG
# Matched params (317M, 21 layers), batch=16, seq=2048
# Fair comparison with corrected LOLM config

model:
  d_model: 1024
  n_heads: 16
  n_layers: 21              # Extra layers to match ~317M params
  d_ff: 4096
  vocab_size: 50257
  max_seq_len: 2048
  dropout: 0.1

  ssm:
    enabled: false
  regime:
    enabled: false
  memory:
    enabled: false
  gate:
    enabled: false

data:
  dataset: HuggingFaceFW/fineweb-edu
  streaming: true
  tokenizer: gpt2

training:
  device: xla
  batch_size: 16             # Match corrected LOLM config
  grad_accumulation_steps: 1
  compile: false
  gradient_checkpointing: false  # XLA incompatible; 300M fits in 32GB without it
  cache_clear_interval: 5000
  seq_len: 2048              # Match corrected LOLM config
  log_interval: 50
  dtype: bfloat16
  grad_clip: 1.0
  lr: 3.0e-4
  save_interval: 5000
  max_steps: 50000

loss:
  lambda_future: 0.0
  lambda_regime: 0.0
  lambda_mem: 0.0
  lambda_manifest: 0.0
  lambda_balance: 0.0
  use_load_balance: false
  lambda_sticky: 0.0
  use_cpc: false
  cpc_proj_dim: 0
  lambda_changepoint: 0.0
  lambda_competitive: 0.0
  future_window: 8
