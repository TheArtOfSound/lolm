_base_: 1b_v3.4.yaml

model:
  d_model: 4096
  n_heads: 32
  n_layers: 32
  d_ff: 11008
  ssm:
    enabled: true
    use_cuda_kernels: false
    detach_gradients: true
    n_layers: 4
    d_state: 64
    expand: 2
  regime:
    enabled: true
    n_codes: 64
    gradient_isolation: true
    neighbor_interaction: true
    kernel_size: 7
  memory:
    enabled: false
  gate:
    enabled: true
    init_bias: -0.5
    normalize_branches: true

training:
  device: xla
  batch_size: 8
  grad_accumulation_steps: 1
  compile: false
  gradient_checkpointing: true
  cache_clear_interval: 10000
  seq_len: 2048
  log_interval: 10
  dtype: bfloat16
  grad_clip: 1.0
  lr: 1.5e-4
  warmup_steps: 2000
  max_steps: 50000
  save_interval: 2000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95

loss:
  use_cpc: true
  cpc_proj_dim: 128
  cpc_temperature: 0.07
  lambda_future: 0.5
  lambda_competitive: 0.1
  lambda_manifest: 0.01
  lambda_changepoint: 0.0
  lambda_regime: 0.3
  lambda_balance: 0.1
  lambda_sticky: 0.01
  lambda_mem: 0.0

data:
  streaming: true
  dataset: HuggingFaceFW/fineweb-edu
  tokenizer: gpt2
