# Matched decoder-only baseline for LOLM 0.87B on v4-8
# 19 decoder layers to match LOLM total params (~865M)
# All LOLM components disabled (SSM, regime, memory, gate)
# Same training params, same data, same tokenizer

model:
  d_model: 2048
  n_heads: 16
  n_layers: 19
  d_ff: 5504
  vocab_size: 50257
  max_seq_len: 512
  dropout: 0.05
  ssm:
    enabled: false
    n_layers: 1
    d_state: 48
    expand: 2
    use_cuda_kernels: false
    detach_gradients: false
  regime:
    enabled: false
    n_codes: 32
    d_regime: 192
    temp_start: 1.0
    temp_end: 0.5
    temp_anneal_steps: 150000
    neighbor_interaction: false
    neighbor_kernel_size: 7
    gradient_isolation: true
  memory:
    enabled: false
    n_slots: 64
    n_banks: 3
    slot_dim: 2048
    n_chunks: 4
  gate:
    enabled: false
    init_bias: -0.5
    normalize_branches: true
training:
  device: xla
  batch_size: 2
  grad_accumulation_steps: 1
  seq_len: 512
  max_steps: 500000
  lr: 0.0003
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 2000
  grad_clip: 0.5
  dtype: bfloat16
  log_interval: 10
  eval_interval: 2000
  save_interval: 500
  compile: false
  gradient_checkpointing: false
loss:
  use_cpc: false
  cpc_proj_dim: 0
  cpc_temperature: 0.07
  lambda_future: 0.0
  lambda_competitive: 0.0
  lambda_manifest: 0.0
  lambda_changepoint: 0.0
  lambda_regime: 0.0
  lambda_balance: 0.0
  lambda_sticky: 0.0
  lambda_mem: 0.0
  future_window: 8
  use_load_balance: false
  cpc_max_positions: 256
data:
  streaming: true
  dataset: HuggingFaceFW/fineweb-edu
  tokenizer: gpt2
