_base_: 1b_v3.4.yaml

model:
  d_model: 4096
  n_heads: 32
  n_layers: 36
  d_ff: 11008
  ssm:
    enabled: false
    use_cuda_kernels: false
  regime:
    enabled: false
  memory:
    enabled: false
  gate:
    enabled: false

training:
  device: xla
  batch_size: 8
  grad_accumulation_steps: 1
  compile: false
  gradient_checkpointing: true
  cache_clear_interval: 10000
  seq_len: 2048
  log_interval: 10
  dtype: bfloat16
  grad_clip: 1.0
  lr: 1.5e-4
  warmup_steps: 2000
  max_steps: 50000
  save_interval: 2000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95

loss:
  use_cpc: false
  lambda_future: 0.0
  lambda_competitive: 0.0
  lambda_manifest: 0.0
  lambda_changepoint: 0.0
  lambda_regime: 0.0
  lambda_balance: 0.0
  lambda_sticky: 0.0
  lambda_mem: 0.0

data:
  streaming: true
  dataset: HuggingFaceFW/fineweb-edu
  tokenizer: gpt2
