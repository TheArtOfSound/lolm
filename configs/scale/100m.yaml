# LOLM 100M — RTX 4090 24GB Validation Run
# ~114M parameters, scaling validation
# Training: ~25K steps in ~28 hours on 1x RTX 4090
# Cost: ~$9.50 on Vast.ai
#
# Effective batch: 2 * 16 accum = 32 sequences * 1024 tokens = 32,768 tokens/step
# Total tokens at 25K steps: ~820M tokens

model:
  d_model: 768
  n_heads: 12
  n_layers: 12
  d_ff: 3072
  vocab_size: 50257
  max_seq_len: 1024
  dropout: 0.1

  ssm:
    enabled: true
    n_layers: 2
    d_state: 24
    expand: 2
    use_cuda_kernels: false  # Use parallel scan (no mamba-ssm dependency)

  regime:
    enabled: true
    n_codes: 24
    d_regime: 96
    temp_start: 1.0
    temp_end: 0.1
    temp_anneal_steps: 20000

  memory:
    enabled: true
    n_slots: 64
    n_banks: 3
    slot_dim: 768

  gate:
    enabled: true

training:
  batch_size: 2
  seq_len: 1024
  max_steps: 25000
  lr: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 1000
  grad_clip: 1.0
  device: cuda
  dtype: bfloat16
  log_interval: 50
  eval_interval: 1000
  save_interval: 5000
  cache_clear_interval: 500
  grad_accumulation_steps: 16
  compile: true

loss:
  lambda_future: 0.1
  lambda_regime: 0.05
  lambda_mem: 0.05
  lambda_manifest: 0.01
  future_window: 16

data:
  dataset: HuggingFaceFW/fineweb-edu
  tokenizer: gpt2
  cache_dir: ./data
  streaming: true
