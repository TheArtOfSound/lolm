# Deployed into the lolm.imagineqira.com server block (before `location / {`).
# Makes the natural path /brain/stats resolve on the main domain by proxying to
# the Cloudflare Worker (D1 brain), so the page's "verify at /brain/stats" is true.
location = /brain/stats {
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    set $brain_up "lolm-edge.bryanleonard237.workers.dev";
    proxy_pass https://$brain_up/brain/stats;
    proxy_ssl_server_name on;
    proxy_set_header Host $brain_up;
    proxy_buffering off;
    add_header Cache-Control "public, max-age=60";
}
