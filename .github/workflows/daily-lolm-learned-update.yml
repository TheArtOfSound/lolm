name: daily-lolm-learned-update

# Self-driving daily learned update. Gates ALWAYS run; it only merges / publishes /
# deploys when invoked with fire=true (or on the daily schedule) AND the matching
# secret exists AND every proof gate passes. A blocked run fails the job and opens a
# BLOCKED issue with the receipt — it never looks like a green ship.

on:
  schedule:
    - cron: '17 7 * * *'        # 07:17 UTC daily
  workflow_dispatch:
    inputs:
      fire:
        description: 'Actually merge/publish/deploy if gates pass (false = shadow run)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write                # npm provenance / trusted publishing

concurrency:
  group: daily-lolm-learned-update
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        # Lean set — the daily gate runs the torch-free logic suites (control,
        # release, research, HF, autonomy, verifiers). Model-integration tests
        # that need torch run in a separate heavier job, not this daily gate.
        run: |
          python -m pip install -U pip
          pip install pytest requests fastapi "pydantic>=2" "uvicorn[standard]" pynacl numpy
      - name: Configure git identity
        run: |
          git config user.name  "lolm-daily-agent"
          git config user.email "agent@imagineqira.com"
      - name: Optional deploy key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          # GitHub Actions disallows secrets in step-level if:, so gate in bash.
          if [ -n "$DEPLOY_KEY" ]; then
            mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H "${DEPLOY_SSH_HOST##*@}" >> ~/.ssh/known_hosts 2>/dev/null || true
          else
            echo "no DEPLOY_KEY secret — skipping (deploy stays gated)"
          fi
      - name: Run daily learned update
        id: run
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          GH_TOKEN: ${{ github.token }}
          LOLM_TEST_CMD: 'python -m pytest tests/test_release.py tests/test_hf_ingest.py tests/test_research.py tests/test_research_pipeline.py tests/test_research_jobs.py tests/test_research_scheduler.py tests/test_control.py tests/test_autonomy.py tests/test_verifiers.py -q'
        run: |
          FIRE=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.fire }}" = "true" ]; then
            FIRE="--allow-fire --commit --push"
          fi
          python scripts/agent_daily_update.py $FIRE --test-cmd "$LOLM_TEST_CMD"
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-receipt
          path: runs/daily/
      - name: Open BLOCKED issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'The daily learned update **blocked itself** — gates failed. See the receipt artifact.';
            try {
              const dir = 'runs/daily';
              const md = fs.readdirSync(dir).filter(f => f.endsWith('.md')).sort().pop();
              if (md) body = fs.readFileSync(`${dir}/${md}`, 'utf8');
            } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `BLOCKED: daily learned update ${new Date().toISOString().slice(0,10)}`,
              body, labels: ['BLOCKED', 'autonomous-agent']
            });
