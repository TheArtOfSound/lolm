name: Offline security research lab
on:
  push:
    paths:
      - 'lolm/security_research/**'
      - 'tests/test_security_research.py'
      - 'doc/security_research_lab.md'
      - '.github/workflows/security-research-lab.yml'
  pull_request:
    paths:
      - 'lolm/security_research/**'
      - 'tests/test_security_research.py'
      - 'doc/security_research_lab.md'
      - '.github/workflows/security-research-lab.yml'
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run isolated offline unit tests
        run: python -m unittest discover -s tests -p test_security_research.py -v
      - name: Run baseline benchmark
        run: python -m lolm.security_research.cli benchmark > security-research-benchmark.json
