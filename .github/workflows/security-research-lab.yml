name: Offline security research lab
on:
  push:
    paths:
      - 'lolm/security_research/**'
      - 'tests/test_security_*.py'
      - 'scripts/capture_security_nfet_trace.py'
      - 'doc/security_research_lab.md'
      - '.github/workflows/security-research-lab.yml'
  pull_request:
    paths:
      - 'lolm/security_research/**'
      - 'tests/test_security_*.py'
      - 'doc/security_research_lab.md'
      - '.github/workflows/security-research-lab.yml'
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run isolated offline unit tests
        run: python -m unittest discover -s tests -p test_security_*.py -v
      - name: Run baseline benchmark
        run: python -m lolm.security_research.cli benchmark > security-research-benchmark.json
      - name: Run deliberately adversarial stress suite
        run: python -m lolm.security_research.cli stress > security-research-stress.json
      - name: Validate local capture exporter syntax
        run: python -m py_compile scripts/capture_security_nfet_trace.py
      - name: Generate split synthetic event study
        run: python -m lolm.security_research.cli make-study /tmp/security-study > /tmp/security-study-manifest.json
