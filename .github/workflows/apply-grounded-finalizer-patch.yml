name: apply-grounded-finalizer-patch

on:
  pull_request:
    paths:
      - ".github/workflows/apply-grounded-finalizer-patch.yml"
      - "lolm/answer_policy.py"
      - "tests/test_answer_policy.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: veyre/agent-capability-upgrade-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply exact guarded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("local_ui/nfet_agent.py")
          text = path.read_text(encoding="utf-8")

          import_anchor = "from pydantic import BaseModel\n"
          import_line = "from lolm.answer_policy import build_grounded_finalizer_messages\n"
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit("expected exactly one pydantic import anchor")
              text = text.replace(import_anchor, import_anchor + "\n" + import_line, 1)

          start_marker = '        if web_grounded and profile != "social":\n'
          end_marker = '        elif profile in ("social", "dialog"):\n'
          if text.count(start_marker) != 1:
              raise SystemExit(f"expected exactly one web-grounded start marker, got {text.count(start_marker)}")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = (
              '        if grounded and profile != "social":\n'
              '            system, user = build_grounded_finalizer_messages(\n'
              '                command=command,\n'
              '                evidence_block=self._evidence_block("SOURCES", evidence),\n'
              '                web_grounded=web_grounded,\n'
              '            )\n'
          )
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify syntax and targeted behavior
        shell: bash
        run: |
          python -m py_compile local_ui/nfet_agent.py lolm/answer_policy.py
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_answer_policy.py \
            tests/test_grounded_qa.py \
            tests/test_agent_capability_core.py
      - name: Commit exact integration
        shell: bash
        run: |
          if git diff --quiet -- local_ui/nfet_agent.py; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "LOLM capability integration"
          git config user.email "actions@users.noreply.github.com"
          git add local_ui/nfet_agent.py
          git commit -m "feat(agent): enforce evidence-gated factual finalization"
          git push origin HEAD:veyre/agent-capability-upgrade-v1
