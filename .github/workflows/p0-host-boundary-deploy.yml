name: p0-host-boundary-deploy

# Immutable deployment-only release for the server-side host-delivery boundary.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: p0-host-boundary-deploy
  cancel-in-progress: false

env:
  TRIGGER_BRANCH: veyr/p0-host-boundary-deploy-trigger
  TRIGGER_SHA: 512e21ccd0ad482077f39c351fec2af3f92632a8
  RELEASE_SHA: 933756c710173120ce14c7de7caabb48afb5ccca

jobs:
  deploy:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'veyr/p0-host-boundary-deploy-trigger' &&
      github.event.pull_request.head.sha == '512e21ccd0ad482077f39c351fec2af3f92632a8'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out immutable product release
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Guard deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEPLOY_SSH_HOST }}" || { echo "DEPLOY_SSH_HOST missing"; exit 1; }
          test -n "${{ secrets.DEPLOY_KEY }}" || { echo "DEPLOY_KEY missing"; exit 1; }

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${DEPLOY_SSH_HOST##*@}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy and prove live exact-byte PDF delivery
        id: production_deploy
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          LOLM_RELEASE_SHA: ${{ env.RELEASE_SHA }}
        shell: bash
        run: bash deploy/deploy_box.sh

      - name: Fallback paired rollback
        if: ${{ failure() && steps.production_deploy.outcome == 'failure' }}
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        shell: bash
        run: bash deploy/rollback_box.sh
