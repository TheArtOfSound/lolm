name: verify-published-cli

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published lolm-cli version to verify'
        required: true
        default: '1.1.0'

permissions:
  contents: read

jobs:
  clean-install:
    name: Clean install / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          registry-url: 'https://registry.npmjs.org'
      - name: Install the public package in an unrelated project
        run: |
          mkdir "$RUNNER_TEMP/clean-${{ matrix.node }}"
          cd "$RUNNER_TEMP/clean-${{ matrix.node }}"
          npm init -y >/dev/null
          npm install "lolm-cli@${{ inputs.version }}" --ignore-scripts --no-audit --no-fund
          test "$(./node_modules/.bin/lolm --version)" = "${{ inputs.version }}"
          ./node_modules/.bin/lolm --help | grep -q COMMANDS
          ./node_modules/.bin/lolm providers --json > providers.json
          node -e "const x=require('./providers.json'); if(!x.ok || x.providers.length < 10)process.exit(1)"
          if grep -R 'lolm.imagineqira.com/api/demo' node_modules/lolm-cli/bin node_modules/lolm-cli/lib; then
            echo 'published CLI contains a hosted execution dependency'
            exit 1
          fi

  local-byok-smoke:
    name: Local BYOK provider smoke
    needs: clean-install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install public CLI and verify a local provider call
        run: |
          mkdir "$RUNNER_TEMP/live"
          cd "$RUNNER_TEMP/live"
          npm init -y >/dev/null
          npm install "lolm-cli@${{ inputs.version }}" --ignore-scripts --no-audit --no-fund
          node - <<'JS' &
          const { createServer } = require('node:http');
          createServer((req, res) => {
            let body = '';
            req.on('data', chunk => body += chunk);
            req.on('end', () => {
              const payload = JSON.parse(body || '{}');
              res.writeHead(200, { 'content-type': 'application/json' });
              res.end(JSON.stringify({ choices: [{ message: {
                role: 'assistant', content: `published local answer from ${payload.model}`,
              } }] }));
            });
          }).listen(18181, '127.0.0.1');
          JS
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:18181/v1/models >/dev/null && break
            sleep 1
          done
          ./node_modules/.bin/lolm ask 'identify the selected model' --provider custom \
            --base-url http://127.0.0.1:18181/v1 --model publish-smoke \
            --api-key local-test --no-nfet --json > result.json
          node -e "const x=require('./result.json'); if(!x.ok || x.response !== 'published local answer from publish-smoke')process.exit(1)"
