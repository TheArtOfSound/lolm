name: one-shot-p0-release

# One-shot bridge for P0 artifact delivery release.
#
# The GitHub connector merge token suppresses push-triggered workflows. This
# workflow lives on the default branch and listens only for a rerun of one exact,
# already-green full-test-suite run. It then checks out one exact integration SHA,
# deploys it with rollback protection, proves live PDF delivery, and only then
# publishes the matching CLI prerelease. It cannot release any other commit.

on:
  workflow_run:
    workflows: ["full-test-suite"]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: one-shot-p0-release
  cancel-in-progress: false

env:
  EXPECTED_TRIGGER_RUN_ID: "30790557019"
  RELEASE_SHA: "892f5d2802afdea73d8f381d5922553b00b99b9e"
  RELEASE_BRANCH: "grok/grand-audit-remediation"

jobs:
  deploy:
    if: >-
      github.event.workflow_run.id == 30790557019 &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.identity.outputs.release_sha }}
    steps:
      - name: Check out the immutable release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Verify immutable release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"
          echo "release_sha=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "Releasing immutable SHA $ACTUAL"

      - name: Guard required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEPLOY_SSH_HOST }}" || { echo "DEPLOY_SSH_HOST missing"; exit 1; }
          test -n "${{ secrets.DEPLOY_KEY }}" || { echo "DEPLOY_KEY missing"; exit 1; }

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${DEPLOY_SSH_HOST##*@}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy backend and website, then prove live PDF delivery
        id: production_deploy
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          LOLM_RELEASE_SHA: ${{ env.RELEASE_SHA }}
        shell: bash
        run: bash deploy/deploy_box.sh

      - name: Roll back the paired app and website snapshot
        if: ${{ steps.production_deploy.outcome == 'failure' }}
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        shell: bash
        run: bash deploy/rollback_box.sh

  publish-cli:
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/cli
    steps:
      - name: Check out the same immutable release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Verify CLI source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Node and npm provenance
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Guard npm publication secret
        shell: bash
        run: 'test -n "${{ secrets.NPM_TOKEN }}" || { echo "NPM_TOKEN missing"; exit 1; }'

      - name: Install, test, and inspect package
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          npm pack --dry-run
          test "$(node -p "require('./package.json').version")" = "0.3.0-beta.2"

      - name: Refuse mutable republish
        shell: bash
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          if npm view "lolm-cli@$V" version >/dev/null 2>&1; then
            echo "lolm-cli@$V already exists; refusing a mutable republish"
            exit 1
          fi

      - name: Publish beta with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: npm publish --provenance --access public --tag beta

      - name: Clean-install and smoke the registry package
        shell: bash
        run: |
          set -euo pipefail
          V="0.3.0-beta.2"
          cd "$RUNNER_TEMP"
          mkdir cli-smoke && cd cli-smoke
          npm init -y >/dev/null
          installed=0
          for i in 1 2 3 4 5 6; do
            if npm install "lolm-cli@$V"; then installed=1; break; fi
            sleep 10
          done
          test "$installed" -eq 1
          ./node_modules/.bin/lolm --version | grep -qx "$V"
          ./node_modules/.bin/lolm --help | grep -q "artifact last|open"
          set +e
          OUT="$(./node_modules/.bin/lolm code 'make a PDF proving I attend ASU and fill in the rest' 2>&1)"
          RC=$?
          set -e
          test "$RC" -eq 2
          printf '%s\n' "$OUT" | grep -qi "cannot fabricate official proof"
          ./node_modules/.bin/lolm status
          echo "published CLI smoke OK"
