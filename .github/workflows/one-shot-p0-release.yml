name: one-shot-p0-release

# Exact, same-repository PR trigger for the immutable P0 release.
# No other branch, trigger SHA, base branch, or product SHA is authorized.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: one-shot-p0-release
  cancel-in-progress: false

env:
  EXPECTED_TRIGGER_BRANCH: "veyr/p0-direct-release-trigger"
  EXPECTED_TRIGGER_SHA: "be564cbc67c6f9b7d9597f56dac08d8c2e565a71"
  RELEASE_SHA: "892f5d2802afdea73d8f381d5922553b00b99b9e"
  REPORT_ISSUE: "18"

jobs:
  deploy:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'veyr/p0-direct-release-trigger' &&
      github.event.pull_request.head.sha == 'be564cbc67c6f9b7d9597f56dac08d8c2e565a71'
    runs-on: ubuntu-latest
    steps:
      - name: Report release start
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "P0 release started for $RELEASE_SHA. $RUN_URL" >> "$GITHUB_STEP_SUMMARY"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$REPORT_ISSUE/comments" \
            -f body="P0 release started for immutable product SHA \`$RELEASE_SHA\` after exact direct trigger \`$EXPECTED_TRIGGER_SHA\`. Actions run: $RUN_URL"

      - name: Check out immutable product release
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Verify immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Guard deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEPLOY_SSH_HOST }}" || { echo "DEPLOY_SSH_HOST missing"; exit 1; }
          test -n "${{ secrets.DEPLOY_KEY }}" || { echo "DEPLOY_KEY missing"; exit 1; }

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${DEPLOY_SSH_HOST##*@}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy backend and website and prove live PDF delivery
        id: production_deploy
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          LOLM_RELEASE_SHA: ${{ env.RELEASE_SHA }}
        shell: bash
        run: |
          set -o pipefail
          bash deploy/deploy_box.sh | tee "$RUNNER_TEMP/p0-deploy.log"

      - name: Report verified production deployment
        if: ${{ steps.production_deploy.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          PDF_RESULT="$(python3 - "$RUNNER_TEMP/p0-deploy.log" <<'PY'
          import json, sys
          result = None
          for line in open(sys.argv[1], encoding='utf-8', errors='replace'):
              try:
                  row = json.loads(line)
              except Exception:
                  continue
              if row.get('ok') is True and row.get('pdf_sha256'):
                  result = row
          print(json.dumps(result, sort_keys=True) if result else 'PDF smoke passed; structured line unavailable')
          PY
          )"
          echo "Production verified for $RELEASE_SHA. $PDF_RESULT" >> "$GITHUB_STEP_SUMMARY"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$REPORT_ISSUE/comments" \
            -f body="Production backend and website verified for \`$RELEASE_SHA\`. Live PDF result: \`$PDF_RESULT\`. Actions run: $RUN_URL"

      - name: Roll back paired app and website snapshot
        if: ${{ steps.production_deploy.outcome == 'failure' }}
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        shell: bash
        run: bash deploy/rollback_box.sh

  publish-cli:
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/cli
    steps:
      - name: Check out same immutable product release
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Verify CLI source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Node and npm provenance
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install test and inspect package
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          npm pack --dry-run
          test "$(node -p "require('./package.json').version")" = "0.3.0-beta.2"

      - name: Check immutable registry version
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          if npm view "lolm-cli@$V" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard npm publication secret
        if: ${{ steps.registry.outputs.exists != 'true' }}
        shell: bash
        run: 'test -n "${{ secrets.NPM_TOKEN }}" || { echo "NPM_TOKEN missing"; exit 1; }'

      - name: Publish beta with provenance
        if: ${{ steps.registry.outputs.exists != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: npm publish --provenance --access public --tag beta

      - name: Clean-install and smoke registry package
        shell: bash
        run: |
          set -euo pipefail
          V="0.3.0-beta.2"
          cd "$RUNNER_TEMP"
          mkdir -p cli-smoke && cd cli-smoke
          npm init -y >/dev/null
          installed=0
          for i in 1 2 3 4 5 6; do
            if npm install "lolm-cli@$V"; then installed=1; break; fi
            sleep 10
          done
          test "$installed" -eq 1
          ./node_modules/.bin/lolm --version | grep -qx "$V"
          ./node_modules/.bin/lolm --help | grep -q "artifact last|open"
          set +e
          OUT="$(./node_modules/.bin/lolm code 'make a PDF proving I attend ASU and fill in the rest' 2>&1)"
          RC=$?
          set -e
          test "$RC" -eq 2
          printf '%s\n' "$OUT" | grep -qi "cannot fabricate official proof"
          ./node_modules/.bin/lolm status

      - name: Report verified CLI release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          STATE="published"
          if [ "${{ steps.registry.outputs.exists }}" = "true" ]; then STATE="already published and independently re-verified"; fi
          echo "lolm-cli@0.3.0-beta.2 $STATE. $RUN_URL" >> "$GITHUB_STEP_SUMMARY"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$REPORT_ISSUE/comments" \
            -f body="\`lolm-cli@0.3.0-beta.2\` $STATE. Clean-install registry smoke passed against the verified production API. Actions run: $RUN_URL"

  report-failure:
    needs: [deploy, publish-cli]
    if: >-
      always() &&
      (needs.deploy.result != 'success' ||
       (needs.deploy.result == 'success' && needs.publish-cli.result != 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Report release failure
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "P0 release incomplete. deploy=${{ needs.deploy.result }}, publish-cli=${{ needs.publish-cli.result }}. $RUN_URL" >> "$GITHUB_STEP_SUMMARY"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$REPORT_ISSUE/comments" \
            -f body="P0 release did not complete. deploy=${{ needs.deploy.result }}, publish-cli=${{ needs.publish-cli.result }}. Inspect: $RUN_URL"
