name: grok-grand-audit-independent

on:
  pull_request:
    paths:
      - 'tests/test_grok_grand_audit_independent.py'
      - '.github/workflows/grok-grand-audit-independent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale-base:
    name: Verify remediation contains current main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require current main as ancestor
        run: |
          git fetch origin main
          echo "HEAD=$(git rev-parse HEAD)"
          echo "MAIN=$(git rev-parse origin/main)"
          echo "MERGE_BASE=$(git merge-base HEAD origin/main)"
          git merge-base --is-ancestor origin/main HEAD

  claimed-suite:
    name: Run claimed 70-test architecture suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: |
          python -m pip install -U pip
          pip install pytest cryptography pynacl pydantic fastapi
      - name: Run claimed tests with exact count
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/test_reliability_architecture.py tests/test_code_agent_context.py -q -ra --durations=20

  independent-adversarial:
    name: Run independent architectural invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: |
          python -m pip install -U pip
          pip install pytest cryptography pynacl pydantic fastapi
      - name: Run independent tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/test_grok_grand_audit_independent.py -vv -ra --tb=short

  existing-cli-and-gauntlet:
    name: Existing CLI and release gauntlet
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: JavaScript client suite
        run: node clients/js/test/run.mjs
      - name: CLI suite
        run: node clients/cli/test/run.mjs
      - name: 49,000-assertion release gauntlet
        run: node verification/release_gauntlet.mjs
