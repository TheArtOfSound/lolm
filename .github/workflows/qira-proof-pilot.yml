name: QIRA Proof privacy and functionality pilot
on:
  push:
    branches: ['product/qira-proof-pilot-2026-11-15', 'product/qira-proof-github-app-auth-2026-11-15']
    paths:
      - 'product/qira-proof/**'
      - '.github/workflows/qira-proof-pilot.yml'
  pull_request:
    paths:
      - 'product/qira-proof/**'
      - '.github/workflows/qira-proof-pilot.yml'
permissions:
  contents: read
jobs:
  qira-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python collector unit tests
        run: python -m unittest discover -s product/qira-proof/tests -p 'test_*.py' -v
      - name: Browser engine and Worker privacy tests
        run: node --test product/qira-proof/tests/*.test.mjs
      - name: Reproducible self-contained Worker build
        run: |
          node product/qira-proof/build.mjs
          node --check product/qira-proof/dist/worker.mjs
      - name: Verify no embedded credentials or stateful endpoints
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('product/qira-proof/dist/worker.mjs').read_text()
          assert "connect-src 'self'" in source
          assert "uploads_enabled:false" in source
          assert "handleGitHubApp(request,env)" in source
          assert "request.method!=='GET'" in source
          # Public instructional names of local environment variables are harmless.
          # Assert that no client-side token value assignment or persistence is introduced.
          for forbidden in ('const GITHUB_TOKEN=', 'const CLOUDFLARE_API_TOKEN=',
                            'const VERCEL_TOKEN=', 'localStorage.setItem(',
                            'sessionStorage.setItem('):
              assert forbidden not in source, forbidden
          assert 'mergeSnapshots' in source
          # Cloudflare Workers does not implement Fetch redirect='error'.
          # This exact bug blocked real GitHub OAuth even though Node tests passed.
          assert 'redirect:"error"' not in source
          assert 'method:"POST",redirect:"manual"' in source
          assert 'method:"GET",redirect:"manual"' in source
          assert 'opaqueredirect' in source
          print("PASS: read-only providers, no client-side token storage, and multi-source composition")
          PY
