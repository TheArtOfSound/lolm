name: p1b-final-cleanup

on:
  pull_request:
    branches: [grok/grand-audit-remediation]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: p1b-final-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository == 'TheArtOfSound/lolm' &&
      github.event.pull_request.head.ref == 'veyr/p1b-command-tool-admission' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Remove temporary P1-B machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/p1b-code-agent-admission-apply.yml
          rm -f .github/workflows/p1b-code-agent-admission-v2.yml
          rm -f .github/workflows/p1b-cleanup-temporary.yml
          rm -f .github/workflows/p1b-final-cleanup.yml
          rm -f scripts/p1b_apply_code_agent_admission.py
          rm -f scripts/p1b_apply_code_agent_admission_v2.py
          rm -f .p1b-*trigger*
          git config user.name 'LOLM P1B Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to clean.'
            exit 0
          fi
          git commit -m 'chore(p1b): remove temporary patch machinery'
          git push origin HEAD:veyr/p1b-command-tool-admission
