name: rollback-production

# Manual emergency rollback to the last-known-good build on the box, then re-check
# health. Inert until DEPLOY_SSH_HOST + DEPLOY_KEY secrets are set.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are we rolling back?'
        required: true

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard — require deploy secrets
        run: '[ -n "${{ secrets.DEPLOY_SSH_HOST }}" ] && [ -n "${{ secrets.DEPLOY_KEY }}" ] || { echo "deploy secrets not set — refusing"; exit 1; }'
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Roll back + verify health
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          echo "Rollback reason: ${{ inputs.reason }}"
          bash deploy/rollback_box.sh
