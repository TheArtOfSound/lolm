name: agent-capability-upgrade

on:
  pull_request:
    paths:
      - "lolm/agent_capability_core.py"
      - "lolm/command_preflight.py"
      - "lolm/capability_router.py"
      - "lolm/grounded_qa.py"
      - "lolm/repo_context.py"
      - "lolm/task_profiler.py"
      - "tests/test_agent_capability_core.py"
      - "tests/test_command_preflight.py"
      - "tests/test_capability_router.py"
      - "tests/test_grounded_qa.py"
      - "tests/test_repo_context.py"
      - "tests/test_task_profiler.py"
      - "evals/agent_capability_manifest.json"
      - ".github/workflows/agent-capability-upgrade.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-agent-core:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate benchmark manifest
        shell: bash
        run: python -m json.tool evals/agent_capability_manifest.json > /dev/null
      - name: Run deterministic agent tests
        run: >-
          python -m pytest -q
          tests/test_agent_capability_core.py
          tests/test_command_preflight.py
          tests/test_capability_router.py
          tests/test_grounded_qa.py
          tests/test_repo_context.py
          tests/test_task_profiler.py
