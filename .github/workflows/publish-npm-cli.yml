name: publish-npm-cli

# Publish clients/cli (the `lolm` command) with provenance, then smoke-test the
# published binary in a clean project. Fail-closed until NPM_TOKEN is set.

on:
  push:
    branches:
      - grok/grand-audit-remediation
    paths:
      - 'clients/cli/**'
      - 'clients/js/**'
      - 'package-lock.json'
      - '.github/workflows/publish-npm-cli.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (blank = whatever package.json says)'
        required: false
      dry_run:
        description: 'Pack and test only — do not publish'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write                # npm provenance

concurrency:
  group: publish-npm-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Guard — require NPM_TOKEN
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: '[ -n "${{ secrets.NPM_TOKEN }}" ] || { echo "NPM_TOKEN not set — refusing to publish"; exit 1; }'
      - name: Set version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        run: npm version "${{ inputs.version }}" --no-git-tag-version
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Test + inspect package contents
        run: |
          npm test
          npm pack --dry-run
      - name: Refuse an already-published version
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          V="$(node -p "require('./package.json').version")"
          if npm view "lolm-cli@$V" version >/dev/null 2>&1; then
            echo "lolm-cli@$V already exists; refusing a mutable republish"
            exit 1
          fi
      - name: Publish (provenance)
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V="$(node -p "require('./package.json').version")"
          TAG=latest
          if [[ "$V" == *-* ]]; then
            TAG="${V#*-}"
            TAG="${TAG%%.*}"
            case "$TAG" in
              alpha|beta|canary|next|rc) ;;
              *) TAG=next ;;
            esac
          fi
          echo "Publishing $V with dist-tag $TAG"
          npm publish --provenance --access public --tag "$TAG"
      - name: Smoke the published binary in a clean project
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          V="$(node -p "require('./package.json').version")"
          cd "$RUNNER_TEMP"
          mkdir cli-smoke && cd cli-smoke && npm init -y >/dev/null
          # the registry needs a moment to serve a brand-new version
          installed=0
          for i in 1 2 3 4 5 6; do
            if npm install "lolm-cli@$V"; then installed=1; break; fi
            sleep 10
          done
          [ "$installed" -eq 1 ]
          ./node_modules/.bin/lolm --version | grep -qx "$V"
          ./node_modules/.bin/lolm --help | grep -q "USAGE"
          # local P0 checks must not call production
          set +e
          OUT="$(./node_modules/.bin/lolm code 'make a PDF proving I attend ASU and fill in the rest' 2>&1)"
          RC=$?
          set -e
          [ "$RC" -eq 2 ]
          printf '%s\n' "$OUT" | grep -qi "cannot fabricate official proof"
          # a real network call against the hosted API proves the installed binary runs
          ./node_modules/.bin/lolm status
          echo "cli smoke OK"
