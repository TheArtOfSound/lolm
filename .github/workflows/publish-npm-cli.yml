name: publish-npm-cli

# Publish clients/cli (the `lolm` command) with provenance, then smoke-test the
# published binary in a clean project. Called only after production deployment
# succeeds, or manually for a dry run.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to publish (blank = whatever package.json says)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Pack and test only — do not publish'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (blank = whatever package.json says)'
        required: false
      dry_run:
        description: 'Pack and test only — do not publish'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write                # npm provenance

concurrency:
  group: publish-npm-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Guard — require NPM_TOKEN
        if: ${{ !inputs.dry_run }}
        run: '[ -n "${{ secrets.NPM_TOKEN }}" ] || { echo "NPM_TOKEN not set — refusing to publish"; exit 1; }'
      - name: Set version
        if: ${{ inputs.version != '' }}
        run: npm version "${{ inputs.version }}" --no-git-tag-version
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Test + inspect package contents
        run: |
          npm test
          npm pack --dry-run
      - name: Inspect registry state
        id: registry
        if: ${{ !inputs.dry_run }}
        run: |
          V="$(node -p "require('./package.json').version")"
          if npm view "lolm-cli@$V" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "lolm-cli@$V already exists; verify it without republishing"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish (provenance)
        if: ${{ !inputs.dry_run && steps.registry.outputs.exists != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V="$(node -p "require('./package.json').version")"
          TAG=latest
          if [[ "$V" == *-* ]]; then
            TAG="${V#*-}"
            TAG="${TAG%%.*}"
            case "$TAG" in
              alpha|beta|canary|next|rc) ;;
              *) TAG=next ;;
            esac
          fi
          echo "Publishing $V with dist-tag $TAG"
          npm publish --provenance --access public --tag "$TAG"
      - name: Smoke the published local binary in a clean project
        if: ${{ !inputs.dry_run }}
        run: |
          V="$(node -p "require('./package.json').version")"
          cd "$RUNNER_TEMP"
          mkdir cli-smoke && cd cli-smoke && npm init -y >/dev/null
          # npm's publish endpoint can acknowledge before every read replica
          # serves the immutable tarball. Poll the registry document first and
          # allow three minutes before treating propagation as a release error.
          available=0
          for i in {1..18}; do
            if curl -fsS "https://registry.npmjs.org/lolm-cli/$V" >/dev/null; then available=1; break; fi
            sleep 10
          done
          [ "$available" -eq 1 ]
          npm install "lolm-cli@$V" --prefer-online --no-audit --no-fund
          ./node_modules/.bin/lolm --version | grep -qx "$V"
          ./node_modules/.bin/lolm --help | grep -q "COMMANDS"
          ./node_modules/.bin/lolm providers --json > providers.json
          node -e "const x=require('./providers.json'); if(!x.ok || x.providers.length < 10)process.exit(1)"
          for item in LICENSE README.md package.json scripts/postinstall.mjs bin/lolm.mjs lib/agent.mjs lib/config.mjs lib/nfet.mjs lib/nfet_bridge.py lib/pdf.mjs lib/providers.mjs lib/session.mjs lib/tools.mjs lib/tui.mjs; do
            diff -q "$GITHUB_WORKSPACE/clients/cli/$item" "node_modules/lolm-cli/$item"
          done
          # The public package must not depend on the retired LOLM hosted API.
          if grep -R "lolm.imagineqira.com/api/demo" node_modules/lolm-cli/bin node_modules/lolm-cli/lib; then
            echo "published CLI contains a hosted execution dependency"
            exit 1
          fi
          echo "cli smoke OK"
