name: deploy-production

# Deploy to the production box + smoke/health/critical-route checks. Auto-rolls
# back on a failed check. Inert until DEPLOY_SSH_HOST + DEPLOY_KEY secrets are set.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard — require deploy secrets
        run: '[ -n "${{ secrets.DEPLOY_SSH_HOST }}" ] && [ -n "${{ secrets.DEPLOY_KEY }}" ] || { echo "deploy secrets not set — refusing"; exit 1; }'
      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # DEPLOY_SSH_HOST is user@host; ssh-keyscan needs the bare host
          ssh-keyscan -H "${DEPLOY_SSH_HOST##*@}" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Deploy + health checks
        id: deploy
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: bash deploy/deploy_box.sh
      - name: Auto-rollback on failure
        if: failure()
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: bash deploy/rollback_box.sh
