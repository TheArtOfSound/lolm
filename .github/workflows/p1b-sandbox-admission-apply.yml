name: p1b-sandbox-admission-apply

on:
  pull_request:
    branches: [grok/grand-audit-remediation]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: p1b-sandbox-admission-apply
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.repository == 'TheArtOfSound/lolm' &&
      github.event.pull_request.head.ref == 'veyr/p1b-command-tool-admission' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply and verify mandatory admission
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/p1b_apply_sandbox_admission.py
          python3 -m pip install --disable-pip-version-check pytest
          python3 -m pytest \
            tests/test_command_preflight.py \
            tests/test_command_admission.py \
            tests/test_sandbox.py \
            -q

      - name: Commit product changes only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'LOLM P1B Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add local_ui/sandbox.py tests/test_sandbox.py
          test -z "$(git diff --cached --name-only | grep -Ev '^(local_ui/sandbox\.py|tests/test_sandbox\.py)$' || true)"
          git commit -m 'feat(p1b): require admission at sandbox execution boundary'
          git push origin HEAD:veyr/p1b-command-tool-admission
