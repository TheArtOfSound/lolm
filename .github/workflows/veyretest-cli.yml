name: veyretest-cli-independent

on:
  pull_request:
    paths:
      - 'clients/cli/**'
      - 'clients/js/**'
      - 'verification/veyretest_cli.mjs'
      - 'verification/veyretest_cli_runner.mjs'
      - '.github/workflows/veyretest-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial:
    name: Independent adversarial / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Existing JavaScript client suite
        run: node clients/js/test/run.mjs
      - name: Existing CLI suite
        run: node clients/cli/test/run.mjs
      - name: Existing packed release gauntlet
        run: node verification/release_gauntlet.mjs
      - name: Independent adversarial retest
        run: node verification/veyretest_cli_runner.mjs

  live-hosted:
    name: Live hosted signed save
    needs: adversarial
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Hosted status JSON
        run: |
          node clients/cli/bin/lolm.mjs status --json > status.json
          node -e "const x=require('./status.json'); if(x.model_ready!==true)process.exit(1)"
      - name: Hosted signed artifact save
        run: |
          OUT="$RUNNER_TEMP/veyretest-out"
          RECEIPT="$RUNNER_TEMP/veyretest-receipt.json"
          node clients/cli/bin/lolm.mjs code \
            "Create exactly one file named veyretest-proof.txt containing exactly the text independent retest passed followed by one newline. Do not create any other file." \
            --save "$OUT" \
            --receipt "$RECEIPT" \
            --json --max-steps 8 --idle-timeout 120000 --timeout 300000 > result.json
          node - <<'JS'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('result.json', 'utf8'));
          if (result.ok !== true || result.exit_code !== 0 || result.shipped !== true) throw new Error('run did not ship');
          if (result.integrity?.integrity?.verified !== true) throw new Error('receipt not independently verified');
          if (result.saved?.verified !== true || result.saved?.committed !== true) throw new Error('artifact not verified');
          const out = process.env.RUNNER_TEMP + '/veyretest-out/veyretest-proof.txt';
          const body = fs.readFileSync(out);
          if (!body.equals(Buffer.from('independent retest passed\n'))) throw new Error('artifact bytes differ');
          const envelope = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/veyretest-receipt.json', 'utf8'));
          if (envelope.receipt?.receipt_sha !== result.receipt.receipt_sha) throw new Error('receipt envelope mismatch');
          if (envelope.done?.run_id !== result.done?.run_id) throw new Error('done envelope mismatch');
          if (envelope.integrity?.integrity?.verified !== true) throw new Error('exported integrity evidence is not verified');
          console.log(JSON.stringify({
            ok: true,
            receipt_sha: envelope.receipt.receipt_sha,
            manifest_sha256: result.saved.manifest_sha256,
            artifact_sha256: result.saved.files[0].sha256,
            bytes: body.length,
          }));
          JS
