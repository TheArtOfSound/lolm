name: p1b-code-agent-admission-apply

on:
  pull_request:
    branches: [grok/grand-audit-remediation]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: p1b-code-agent-admission-apply
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.repository == 'TheArtOfSound/lolm' &&
      github.event.pull_request.head.ref == 'veyr/p1b-command-tool-admission' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply and verify structured admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/p1b_apply_code_agent_admission.py')
          text = path.read_text()

          old = (
              '        "from typing import Any, Callable, Dict, Iterator, List, Optional, Sequence, Tuple\\n",\n'
              '        "from typing import Any, Callable, Dict, Iterator, List, Optional, Sequence, Tuple\\n\\n"\n'
          )
          new = (
              '        "from typing import Any, Callable, Dict, Iterator, List, Optional\\n",\n'
              '        "from typing import Any, Callable, Dict, Iterator, List, Optional, Tuple\\n\\n"\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'import-anchor script correction expected one match, got {text.count(old)}')
          text = text.replace(old, new, 1)

          old = (
              '        "    def _ensure_mutation_gateway(self, task: str):\\n",\n'
              '        helper + "    def _ensure_mutation_gateway(self, task: str):\\n",\n'
          )
          new = (
              '        "    def _ensure_mutation_gateway(self, task: str) -> Any:\\n",\n'
              '        helper + "    def _ensure_mutation_gateway(self, task: str) -> Any:\\n",\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'gateway-anchor script correction expected one match, got {text.count(old)}')
          text = text.replace(old, new, 1)

          old_comment = '# pure DONE → finish'
          new_comment = '# pure DONE → finish (gated on a real, output-producing run)'
          if text.count(old_comment) != 2:
              raise SystemExit(f'turn comment correction expected two matches, got {text.count(old_comment)}')
          path.write_text(text.replace(old_comment, new_comment))
          PY
          python3 scripts/p1b_apply_code_agent_admission.py
          python3 -m pip install --disable-pip-version-check pytest pydantic
          python3 -m pytest \
            tests/test_command_preflight.py \
            tests/test_command_admission.py \
            tests/test_sandbox.py \
            tests/test_code_agent_admission.py \
            -q

      - name: Commit product changes only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'LOLM P1B Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add local_ui/code_agent.py tests/test_code_agent_admission.py
          test -z "$(git diff --cached --name-only | grep -Ev '^(local_ui/code_agent\.py|tests/test_code_agent_admission\.py)$' || true)"
          git commit -m 'feat(p1b): admit structured CodeAgent tools before dispatch'
          git push origin HEAD:veyr/p1b-command-tool-admission
