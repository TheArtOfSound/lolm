<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LOLM-NFET Local Workspace</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">Ω</div>
        <div>
          <h1>LOLM-NFET</h1>
          <p>Local Workspace</p>
        </div>
      </div>

      <section class="panel">
        <label>Checkpoint profile</label>
        <select id="profile"></select>
        <label>Device</label>
        <select id="device">
          <option value="auto">auto</option>
          <option value="mps">mps</option>
          <option value="cpu">cpu</option>
          <option value="device_map">device_map</option>
        </select>
        <label class="check"><input type="checkbox" id="useGraft" checked /> Enable LOLM-NFET graft</label>
        <label>Ablation</label>
        <select id="ablation">
          <option value="full">full</option>
          <option value="no_latent">no_latent</option>
          <option value="no_regime">no_regime</option>
          <option value="no_gate">no_gate</option>
          <option value="latent_only">latent_only</option>
          <option value="no_residual">no_residual</option>
        </select>
        <button id="loadBtn">Load model</button>
        <div id="status" class="status">Not loaded</div>
      </section>

      <section class="panel grid2">
        <div>
          <label>Max tokens</label>
          <input id="maxTokens" type="number" value="96" min="1" max="512" />
        </div>
        <div>
          <label>Temp</label>
          <input id="temperature" type="number" value="0.8" min="0.01" max="2" step="0.05" />
        </div>
        <div>
          <label>Top-p</label>
          <input id="topP" type="number" value="0.95" min="0.01" max="1" step="0.01" />
        </div>
      </section>

      <section class="panel telemetry">
        <h2>NFET telemetry</h2>
        <div><span>Gate</span><b id="gate">—</b></div>
        <div><span>Regime entropy</span><b id="regime">—</b></div>
        <div><span>Control</span><b id="control">—</b></div>
      </section>
    </aside>

    <main class="chat">
      <header>
        <div>
          <h2>Chat</h2>
          <p>Frozen HF model + optional LOLM-NFET graft, hosted locally.</p>
        </div>
        <button id="clearBtn" class="ghost">Clear</button>
      </header>
      <div id="messages" class="messages"></div>
      <form id="composer" class="composer">
        <textarea id="prompt" placeholder="Message LOLM-NFET..." rows="3"></textarea>
        <button id="sendBtn" type="submit">Send</button>
      </form>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
